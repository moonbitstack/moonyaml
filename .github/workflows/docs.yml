name: Docs

# The homepage, the guide, the examples and the API reference are files in
# `docs/`: what is in the repository is what is served, and there is no build
# step to serve it. The one page a script writes is `docs/api.html`, so this job
# regenerates it and refuses to deploy a page that has drifted from the
# interfaces it describes.
#
# Turn Pages on once in Settings → Pages → Build and deployment → Source:
# GitHub Actions, before pushing this workflow, so the first run is not a failure.
on:
  push:
    branches:
      - master
    paths:
      - "docs/**"
      - "src/**"
      - "scripts/gen_api.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and a queued run is better than a cancelled one: a
# cancelled deploy can leave the site on the previous revision.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: the API reference matches the interfaces
        run: python3 scripts/gen_api.py --check

      - name: no broken relative links
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          site = pathlib.Path("docs")
          broken = []
          for page in sorted(site.glob("*.html")):
              body = page.read_text(encoding="utf-8")
              for ref in re.findall(r'(?:href|src)="([^"#:]+)"', body):
                  if ref.startswith(("http", "//", "data:", "mailto:")):
                      continue
                  if not (site / ref).exists():
                      broken.append(f"{page.name}: {ref}")
          if broken:
              print("\n".join(broken))
              sys.exit(1)
          print("all relative links resolve")
          PY

      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v5
