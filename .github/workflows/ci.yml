name: Check and Test

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install-unix
        if: ${{ runner.os != 'Windows' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: install-windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser; irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: post install
        run: |
          moon version --all
          moon update

      - name: moon check
        run: moon check --target all --deny-warn

      - name: moon build
        run: moon build --target all

      - name: moon test (all backends)
        run: moon test --target all

      # The suite scores are printed by the tests themselves, so the numbers in
      # README.md have a second author: this step lifts them into the run's
      # summary, and the assertions behind them are what fails the build.
      - name: suite summary
        shell: bash
        run: |
          moon test --target js > "$RUNNER_TEMP/test.log" 2>&1 || true
          {
            echo "### moonyaml — the suite"
            echo ""
            echo '```'
            grep -E '(suite\(|doc/suite)' "$RUNNER_TEMP/test.log" || echo "no suite summary in the test output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: lint (fmt is clean)
        run: |
          moon fmt && git diff --exit-code

      # The suite is not vendored; the data file is made from one pinned
      # revision of it. Regenerating from that revision has to give the file in
      # the repository, or the numbers the tests print are about another state
      # of the suite than the one they name.
      - name: the suite data matches the pinned revision
        if: runner.os == 'Linux'
        run: |
          python3 -m pip install --quiet pyyaml
          sha="$(python3 -c 'import sys; sys.path.insert(0, "scripts"); import gen_suite; print(gen_suite.SUITE_COMMIT)')"
          mkdir -p "$RUNNER_TEMP/suite"
          curl -fsSL "https://codeload.github.com/yaml/yaml-test-suite/tar.gz/$sha" \
            | tar -xz -C "$RUNNER_TEMP/suite" --strip-components=1
          python3 scripts/gen_suite.py --check "$RUNNER_TEMP/suite"

      - name: interfaces are up to date
        run: |
          moon info --target all && git diff --exit-code

      - name: the skills are valid
        if: runner.os == 'Linux'
        run: |
          for dir in docs/skills/*/; do
            case "$dir" in *CHANGE-ME*) continue ;; esac
            [ -f "$dir/SKILL.md" ] || continue
            pipx run --spec skills-ref agentskills validate "$dir"
          done

      # A reader pastes the blocks of the README and the skills into a project, so they have
      # to compile as written, against this commit's source.
      - name: the code in the docs compiles
        if: runner.os == 'Linux'
        run: python3 scripts/check_snippets.py

  # Another implementation, in both directions: the corpus is written here and
  # read there, and written there and read here, with the values compared after
  # each leg — under YAML 1.2 and again under 1.1. One platform: what is being
  # measured is a reader against a reader, and the partner is the same pinned
  # package everywhere.
  interop:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: install moonbit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: |
          moon version --all
          moon update

      - name: the other implementation
        run: python3 -m pip install --quiet -r scripts/interop-requirements.txt

      - name: bidirectional interop, YAML 1.2 and 1.1
        run: python3 scripts/check_interop.py
