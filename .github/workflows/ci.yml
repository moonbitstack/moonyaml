name: Check and Test

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install-unix
        if: ${{ runner.os != 'Windows' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: install-windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser; irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: post install
        run: |
          moon version --all
          moon update

      - name: moon check
        run: moon check --target all --deny-warn

      - name: moon build
        run: moon build --target all

      - name: moon test (all backends)
        run: moon test --target all

      # The suite scores are printed by the tests themselves, so the numbers in
      # README.md have a second author: this step lifts them into the run's
      # summary, and the assertions behind them are what fails the build.
      - name: suite summary
        shell: bash
        run: |
          moon test --target js > "$RUNNER_TEMP/test.log" 2>&1 || true
          {
            echo "### moonyaml — the suite"
            echo ""
            echo '```'
            grep -E '(suite\(|doc/suite)' "$RUNNER_TEMP/test.log" || echo "no suite summary in the test output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: lint (fmt is clean)
        run: |
          moon fmt && git diff --exit-code

      - name: interfaces are up to date
        run: |
          moon info --target all && git diff --exit-code
